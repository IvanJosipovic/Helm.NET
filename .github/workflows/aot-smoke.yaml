name: NativeAOT Smoke Test

on:
  pull_request:
    paths:
      - src/Helm.NET/**
      - native/helm-shim/**
      - tests/Helm.NET.AotSmoke/**
      - .github/workflows/aot-smoke.yaml
      - Directory.Build.props
      - global.json
  push:
    branches:
      - main
      - alpha
      - beta
    paths:
      - src/Helm.NET/**
      - native/helm-shim/**
      - tests/Helm.NET.AotSmoke/**
      - .github/workflows/aot-smoke.yaml
      - Directory.Build.props
      - global.json

jobs:
  native-aot:
    name: NativeAOT ${{ matrix.framework }} ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        framework:
          - net10.0
          - net11.0
        include:
          - rid: win-x64
            runner: windows-2025
            shell: pwsh
            executable-prefix: .\aot-publish-
            executable-suffix: \Helm.NET.AotSmoke.exe
          - rid: win-arm64
            runner: windows-11-arm
            shell: pwsh
            executable-prefix: .\aot-publish-
            executable-suffix: \Helm.NET.AotSmoke.exe
          - rid: linux-x64
            runner: ubuntu-24.04
            shell: bash
            executable-prefix: ./aot-publish-
            executable-suffix: /Helm.NET.AotSmoke
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            shell: bash
            executable-prefix: ./aot-publish-
            executable-suffix: /Helm.NET.AotSmoke
          - rid: osx-x64
            runner: macos-15-intel
            shell: bash
            executable-prefix: ./aot-publish-
            executable-suffix: /Helm.NET.AotSmoke
          - rid: osx-arm64
            runner: macos-15
            shell: bash
            executable-prefix: ./aot-publish-
            executable-suffix: /Helm.NET.AotSmoke

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: false

      - name: Install NativeAOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

      - name: Publish NativeAOT smoke application
        run: >-
          dotnet publish tests/Helm.NET.AotSmoke/Helm.NET.AotSmoke.csproj
          --configuration Release
          --framework ${{ matrix.framework }}
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishAot=true
          --output aot-publish-${{ matrix.framework }}

      - name: Run NativeAOT smoke application
        shell: ${{ matrix.shell }}
        run: ${{ matrix.executable-prefix }}${{ matrix.framework }}${{ matrix.executable-suffix }}

  native-aot-kubernetes:
    name: NativeAOT Helm operations ${{ matrix.framework }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework:
          - net10.0
          - net11.0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: false

      - name: Install NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

      - name: Provision an ephemeral Kubernetes cluster
        uses: helm/kind-action@v1.15.1

      - name: Publish NativeAOT smoke application
        run: >-
          dotnet publish tests/Helm.NET.AotSmoke/Helm.NET.AotSmoke.csproj
          --configuration Release
          --framework ${{ matrix.framework }}
          --runtime linux-x64
          --self-contained true
          -p:PublishAot=true
          --output aot-kubernetes-publish-${{ matrix.framework }}

      - name: Smoke test Helm client operations
        run: ./aot-kubernetes-publish-${{ matrix.framework }}/Helm.NET.AotSmoke --cluster
