name: NativeAOT Smoke Test

on:
  workflow_call:

jobs:
  native-aot:
    name: NativeAOT ${{ matrix.framework }} ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        framework:
          - net10.0
          - net11.0
        rid:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64
        include:
          - rid: win-x64
            runner: windows-latest
            executable_prefix: .\aot-publish-
            executable_suffix: \Helm.NET.Tests.AOT.exe
          - rid: win-arm64
            runner: windows-11-arm
            executable_prefix: .\aot-publish-
            executable_suffix: \Helm.NET.Tests.AOT.exe
          - rid: linux-x64
            runner: ubuntu-latest
            executable_prefix: ./aot-publish-
            executable_suffix: /Helm.NET.Tests.AOT
          - rid: linux-arm64
            runner: ubuntu-26.04-arm
            executable_prefix: ./aot-publish-
            executable_suffix: /Helm.NET.Tests.AOT
          - rid: osx-x64
            runner: macos-26-intel
            executable_prefix: ./aot-publish-
            executable_suffix: /Helm.NET.Tests.AOT
          - rid: osx-arm64
            runner: macos-latest
            executable_prefix: ./aot-publish-
            executable_suffix: /Helm.NET.Tests.AOT

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: false

      - name: Install NativeAOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

      - name: Publish NativeAOT smoke application
        run: >-
          dotnet publish tests/Helm.NET.Tests.AOT/Helm.NET.Tests.AOT.csproj
          --configuration Release
          --framework ${{ matrix.framework }}
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishAot=true
          --output aot-publish-${{ matrix.framework }}

      - name: Run NativeAOT smoke application
        run: ${{ matrix.executable_prefix }}${{ matrix.framework }}${{ matrix.executable_suffix }}

  native-aot-kubernetes:
    name: NativeAOT Helm operations ${{ matrix.framework }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework:
          - net10.0
          - net11.0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: false

      - name: Install NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

      - name: Provision an ephemeral Kubernetes cluster
        uses: helm/kind-action@v1.15.1

      - name: Publish NativeAOT smoke application
        run: >-
          dotnet publish tests/Helm.NET.Tests.AOT/Helm.NET.Tests.AOT.csproj
          --configuration Release
          --framework ${{ matrix.framework }}
          --runtime linux-x64
          --self-contained true
          -p:PublishAot=true
          --output aot-kubernetes-publish-${{ matrix.framework }}

      - name: Smoke test Helm client operations
        run: ./aot-kubernetes-publish-${{ matrix.framework }}/Helm.NET.Tests.AOT --cluster
