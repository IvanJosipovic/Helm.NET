name: Update Helm

on:
  push:
    branches:
      - main
      - alpha
      - beta
    paths:
      - src/Helm.NET/Helm.NET.csproj
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-helm:
    name: Download Helm binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7

      - name: Download Helm binaries
        id: download-helm
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          [xml]$project = Get-Content -Raw src/Helm.NET/Helm.NET.csproj
          $helmVersion = $project.SelectSingleNode('//HelmVersion').InnerText.Trim()
          if ([string]::IsNullOrWhiteSpace($helmVersion)) {
            throw 'Could not find HelmVersion in src/Helm.NET/Helm.NET.csproj'
          }

          $assets = [ordered]@{
            'win-x64' = 'windows-amd64.zip'
            'win-arm64' = 'windows-arm64.zip'
            'linux-x64' = 'linux-amd64.tar.gz'
            'linux-arm64' = 'linux-arm64.tar.gz'
            'osx-x64' = 'darwin-amd64.tar.gz'
            'osx-arm64' = 'darwin-arm64.tar.gz'
          }
          $tempRoot = Join-Path $env:RUNNER_TEMP "helm-$helmVersion"
          New-Item -ItemType Directory -Force $tempRoot | Out-Null

          foreach ($entry in $assets.GetEnumerator()) {
            $runtime = $entry.Key
            $archiveName = "helm-$helmVersion-$($entry.Value)"
            $archivePath = Join-Path $tempRoot $archiveName
            $checksumPath = "$archivePath.sha256sum"
            $extractPath = Join-Path $tempRoot $runtime
            $destination = "src/Helm.NET/runtimes/$runtime/native"
            New-Item -ItemType Directory -Force $destination, $extractPath | Out-Null

            Invoke-WebRequest -Uri "https://get.helm.sh/$archiveName" -OutFile $archivePath
            Invoke-WebRequest -Uri "https://get.helm.sh/$archiveName.sha256sum" -OutFile $checksumPath
            $expectedHash = (Get-Content -Raw $checksumPath).Trim() -split '\s+' | Select-Object -First 1
            $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash
            if ($actualHash -ne $expectedHash) {
              throw "SHA-256 check failed for $archiveName"
            }

            if ($archiveName.EndsWith('.zip')) {
              Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force
              $binary = Get-ChildItem -LiteralPath $extractPath -Filter 'helm.exe' -File -Recurse | Select-Object -First 1
              $output = Join-Path $destination 'helm.exe'
            }
            else {
              & tar -xzf $archivePath -C $extractPath
              if ($LASTEXITCODE -ne 0) {
                throw "Could not extract $archiveName"
              }
              $binary = Get-ChildItem -LiteralPath $extractPath -Filter 'helm' -File -Recurse | Select-Object -First 1
              $output = Join-Path $destination 'helm'
            }

            if ($null -eq $binary -or $binary.Length -eq 0) {
              throw "Helm executable was not extracted correctly from $archiveName"
            }

            Copy-Item -LiteralPath $binary.FullName -Destination $output -Force
            if (-not $runtime.StartsWith('win-')) {
              & chmod +x $output
              if ($LASTEXITCODE -ne 0) {
                throw "Could not mark $output as executable"
              }
            }
          }

          Write-Host "Downloaded Helm $helmVersion binaries."
          "helm-version=$helmVersion" >> $env:GITHUB_OUTPUT

      - name: Check files changed
        id: checkfiles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          git add src/Helm.NET/runtimes
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not stage the updated Helm binaries.'
          }

          $createPr = (git diff --cached --numstat | Measure-Object -Line).Lines -gt 0
          "createpr=$($createPr.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Create pull request
        if: steps.checkfiles.outputs.createpr == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: update-helm
          delete-branch: true
          commit-message: 'feat(helm.net): update bundled Helm to ${{ steps.download-helm.outputs.helm-version }}'
          title: 'feat(helm.net): update bundled Helm to ${{ steps.download-helm.outputs.helm-version }}'
          body: 'Updates the bundled Helm binaries to Helm ${{ steps.download-helm.outputs.helm-version }}.'
