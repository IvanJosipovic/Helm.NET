name: Go Shim Tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - native/helm-shim/**
      - src/Helm.NET/**
      - tests/Helm.NET.AotSmoke/**
      - tests/Helm.NET.Tests.E2E/**
      - tests/Helm.NET.Tests.E2E.Shared/**
      - tests/Helm.NET.Tests.E2E.AOT/**
      - Helm.NET.slnx
      - .github/workflows/go-test.yaml
      - .github/workflows/aot-smoke.yaml
      - Directory.Build.props
      - global.json
  push:
    branches:
      - main
      - alpha
      - beta
    paths:
      - native/helm-shim/**
      - src/Helm.NET/**
      - tests/Helm.NET.AotSmoke/**
      - tests/Helm.NET.Tests.E2E/**
      - tests/Helm.NET.Tests.E2E.Shared/**
      - tests/Helm.NET.Tests.E2E.AOT/**
      - Helm.NET.slnx
      - .github/workflows/go-test.yaml
      - .github/workflows/aot-smoke.yaml
      - Directory.Build.props
      - global.json

jobs:
  test:
    name: Test Helm shim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: native/helm-shim/go.mod
          cache-dependency-path: native/helm-shim/go.sum
      - name: Create Kind cluster
        uses: helm/kind-action@v1.15.2
      - name: Run tests
        working-directory: native/helm-shim
        env:
          CGO_ENABLED: 1
          HELM_SHIM_TEST_CLUSTER: "true"
        run: |
          go test -tags=helmshimtest -coverprofile=coverage.raw.txt ./...
          # Keep the test-only cgo adapter out of the production coverage denominator.
          grep -v 'exports_test_support.go:' coverage.raw.txt > coverage.txt
          rm coverage.raw.txt

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: native/helm-shim/coverage.txt
          flags: go
          fail_ci_if_error: true

  managed-kind-e2e:
    name: Managed public API E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: false

      - uses: helm/kind-action@v1.15.2

      - name: Run managed Helm scenarios
        env:
          HELM_TEST_CLUSTER: "true"
        run: dotnet test --project tests/Helm.NET.Tests.E2E/Helm.NET.Tests.E2E.csproj

  native-aot:
    name: NativeAOT smoke tests
    uses: ./.github/workflows/aot-smoke.yaml
